package: python3-protobuf

essential:
  - python3-protobuf_copyright

slices:
  libs:
    essential:
      - python3_standard
      - libc6_libs
      - libgcc-s1_libs
      - libprotobuf32t64_libs
      - libstdc++6_libs
    contents:
      /usr/lib/python3/dist-packages/google/protobuf/**/*.py:
      /usr/lib/python3/dist-packages/google/protobuf/**/*.so:

  copyright:
    contents:
      /usr/share/doc/python3-protobuf/copyright:
